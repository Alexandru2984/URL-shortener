# Install deploy/nginx/shortener-rate-limit.conf in nginx's http context first.
# This file is a site/vhost configuration for c.micutu.com.

server {
    listen 443 ssl http2;
    server_name c.micutu.com;

    ssl_certificate /etc/letsencrypt/live/c.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    limit_conn shortener_conn 32;
    limit_req_status 429;

    # The application also sets these for direct test traffic. Hide those copies
    # so clients receive one canonical policy from the TLS edge.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Content-Security-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    location = /shorten {
        limit_req zone=shortener_write burst=5 nodelay;
        include /etc/nginx/snippets/shortener-proxy.conf;
    }

    location ~ ^/unlock/[A-Za-z0-9-]{1,31}$ {
        limit_req zone=shortener_unlock burst=2 nodelay;
        include /etc/nginx/snippets/shortener-proxy.conf;
    }

    location = /api/admin/links {
        limit_req zone=shortener_admin burst=5 nodelay;
        include /etc/nginx/snippets/shortener-proxy.conf;
    }

    location = /admin {
        limit_req zone=shortener_admin burst=5 nodelay;
        include /etc/nginx/snippets/shortener-proxy.conf;
    }

    location = /health {
        access_log off;
        include /etc/nginx/snippets/shortener-proxy.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        include /etc/nginx/snippets/shortener-proxy.conf;
    }
}

server {
    listen 80;
    server_name c.micutu.com;
    return 301 https://$host$request_uri;
}
