# Include from nginx's http {} block, for example /etc/nginx/conf.d/shortener-rate-limit.conf.
# $remote_addr is the verified visitor address when Cloudflare real_ip support is enabled.
limit_req_zone $binary_remote_addr zone=shortener_write:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=shortener_unlock:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=shortener_admin:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=shortener_conn:10m;
