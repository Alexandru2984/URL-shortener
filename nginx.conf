server {
    listen 80;
    server_name c.micutu.com;

    # Security headers (defense in depth — also set at app level)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https://api.qrserver.com" always;

    # Body size limit (only JSON payloads expected)
    client_max_body_size 16k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent proxy from passing through hop-by-hop headers
        proxy_hide_header X-Powered-By;
    }

    # Block access to sensitive paths
    location ~ /\. { deny all; }
    location /data/ { deny all; }
    location /logs/ { deny all; }
}
